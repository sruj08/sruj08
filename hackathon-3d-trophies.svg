  <text x="38" y="86" class="trophy-title">Pune Agri Hackathon '26</text>
  <text x="38" y="102" class="trophy-sub">Govt. of Maharashtra • <tspan fill="#e6edf3">Out of 2,000+ Teams Worldwide</tspan></text>
