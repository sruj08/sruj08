  <text x="38" y="198" class="trophy-title">VOIS Innovation Marathon 2.0</text>
  <text x="38" y="214" class="trophy-sub">Vodafone Intelligent Solutions • <tspan fill="#e6edf3">Out of 630+ Teams Nationwide</tspan></text>
  <line x1="38" y1="224" x2="404" y2="224" stroke="#30363d" stroke-width="1" />
  <text x="38" y="240" class="trophy-detail">✨ Owned architecture and production deployment</text>
</g>
