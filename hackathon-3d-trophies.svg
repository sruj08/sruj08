  <text x="822" y="178" text-anchor="end" class="trophy-prize">INR 50,000</text>
  <text x="456" y="198" class="trophy-title">iQOO Hackathon '26</text>
  <text x="456" y="214" class="trophy-sub">Phone-First Computing • <tspan fill="#e6edf3">6,500+ Registrations</tspan></text>
  <line x1="456" y1="224" x2="822" y2="224" stroke="#30363d" stroke-width="1" />
  <text x="456" y="240" class="trophy-detail">✨ On-device offline spatial memory & path tracker</text>
