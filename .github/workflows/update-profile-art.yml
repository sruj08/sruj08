name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *" # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3 pillow

      - run: python scripts/fetch_contributions.py

      - run: python scripts/make_apple_header_svg.py

      - run: python scripts/make_apple_achievements_svg.py

      - run: python scripts/make_apple_tech_stack_svg.py

      - run: python scripts/make_apple_heatmap_svg.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph and profile art [skip ci]"
          file_pattern: "data/contributions.json apple-header.svg apple-achievements.svg apple-tech-stack.svg apple-heatmap.svg"
