name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *" # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3 pillow

      - run: python scripts/fetch_contributions.py

      - run: python scripts/render_heatmap_svg.py

      - run: python scripts/make_info_card.py

      - run: python scripts/make_hackathon_3d_svg.py

      - run: python scripts/make_tech_stack_3d_svg.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph and profile art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg info-card.svg hackathon-3d-trophies.svg tech-stack-3d.svg"
