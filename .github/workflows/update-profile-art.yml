name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *" # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3 pillow

      - run: python scripts/fetch_contributions.py

      - run: python scripts/download_official_logos.py

      - run: python scripts/make_all_ascii_svgs.py

      - run: python scripts/make_apple_hig_tech_card.py

      - run: python scripts/make_animated_heatmap.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph and profile art [skip ci]"
          file_pattern: "data/contributions.json assets/logos/*.svg ascii-*.svg tech-stack-professional.svg contrib-heatmap.svg"
