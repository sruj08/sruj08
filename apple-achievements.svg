  <text x="46" y="114" class="item-detail">✨ Felicitated by Chief Minister of Maharashtra</text>
</g>
<g>
  <rect x="440" y="48" width="398" height="88" class="inner-card" />
  <rect x="452" y="62" width="4" height="60" rx="2" fill="#30d158" />
  <text x="464" y="76" class="item-title">TechFiesta '26 International</text>
  <text x="822" y="76" text-anchor="end" class="item-rank" fill="#30d158">🥇 1st Rank (INR 3.5L+ Pool)</text>
  <text x="464" y="94" class="item-sub">Global Agriculture Domain  •  <tspan fill="#e6edf3">700+ Teams Worldwide</tspan></text>
  <text x="464" y="114" class="item-detail">✨ Executed full 24-hour architectural pivot</text>
</g>
<g>
  <rect x="22" y="148" width="398" height="88" class="inner-card" />
  <rect x="34" y="162" width="4" height="60" rx="2" fill="#2997ff" />
  <text x="46" y="176" class="item-title">VOIS Innovation Marathon 2.0</text>
  <text x="404" y="176" text-anchor="end" class="item-rank" fill="#2997ff">🥇 National Winner (INR 2 Lakhs)</text>
  <text x="46" y="194" class="item-sub">Vodafone Intelligent Solutions  •  <tspan fill="#e6edf3">630+ Teams Nationwide</tspan></text>
  <text x="46" y="214" class="item-detail">✨ Architected & deployed live production cloud system</text>
</g>
<g>
  <rect x="440" y="148" width="398" height="88" class="inner-card" />
  <rect x="452" y="162" width="4" height="60" rx="2" fill="#bf5af2" />
  <text x="464" y="176" class="item-title">iQOO Hackathon 2026</text>
  <text x="822" y="176" text-anchor="end" class="item-rank" fill="#bf5af2">🥉 2nd Runner-Up (INR 50K)</text>
  <text x="464" y="194" class="item-sub">Phone-First Computing  •  <tspan fill="#e6edf3">6,500+ Registrations</tspan></text>
