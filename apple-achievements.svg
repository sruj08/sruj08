<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250">
<defs>
  <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#161b22" />
    <stop offset="100%" stop-color="#0d1117" />
  </linearGradient>
</defs>
<style>
  .outer-card { fill: #0d1117; rx: 16px; ry: 16px; stroke: #30363d; stroke-width: 1.2px; }
  .inner-card { fill: url(#cardBg); rx: 12px; ry: 12px; stroke: #30363d; stroke-width: 1px; }
  .section-title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; font-size: 15px; font-weight: 700; fill: #f0f6fc; }
  .item-title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 13.5px; font-weight: 700; fill: #f0f6fc; }
  .item-sub { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 11px; fill: #8b949e; }
  .item-rank { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 12px; font-weight: 700; }
  .item-detail { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 11px; fill: #8b949e; }
</style>
<rect width="860" height="250" class="outer-card" />
<text x="24" y="32" class="section-title">🏆 Major Hackathon Victories &amp; Honors</text>
<g>
  <rect x="22" y="48" width="398" height="88" class="inner-card" />
  <rect x="34" y="62" width="4" height="60" rx="2" fill="#ffd60a" />
  <text x="46" y="76" class="item-title">Pune Agri Hackathon 2026</text>
